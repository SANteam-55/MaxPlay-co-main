name: Build MaxPlay Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies & Build MaxPlay Frontend Bundle
        run: |
          npm install
          npx vite build
          rm -rf android-kotlin/app/src/main/assets/webapp/*
          mkdir -p android-kotlin/app/src/main/assets/webapp
          cp -r dist/* android-kotlin/app/src/main/assets/webapp/

      - name: Setup JDK 17 for Kotlin Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle 8.5 & Android Build Caches
        uses: actions/cache@v4
        with:
          path: |
            /opt/gradle/gradle-8.5
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-8.5-${{ hashFiles('android-kotlin/**/*.gradle*', 'android-kotlin/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.5-

      - name: Setup Android SDK & Gradle
        run: |
          if [ ! -x /opt/gradle/gradle-8.5/bin/gradle ]; then
            echo "Downloading Gradle 8.5 with multi-mirror fallback..."
            sudo mkdir -p /opt/gradle
            DL_OK=0
            for URL in \
              "https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip" \
              "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.5-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-8.5-bin.zip" \
              "https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip"; do
              echo "Trying $URL ..."
              if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 90 "$URL" -o /tmp/gradle-8.5-bin.zip; then
                if unzip -tq /tmp/gradle-8.5-bin.zip >/dev/null 2>&1; then
                  sudo unzip -q -o /tmp/gradle-8.5-bin.zip -d /opt/gradle
                  rm -f /tmp/gradle-8.5-bin.zip
                  DL_OK=1
                  break
                fi
              fi
            done
            if [ "$DL_OK" -ne 1 ]; then
              echo "Fallback to pre-installed runner Gradle..."
            fi
          fi
          if [ -x /opt/gradle/gradle-8.5/bin/gradle ]; then
            echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH
            /opt/gradle/gradle-8.5/bin/gradle --version
          else
            gradle --version
          fi

      - name: Generate Release Keystore & Compile Signed MaxPlay + MaxPlay Admin Release APKs
        working-directory: ./android-kotlin
        run: |
          rm -rf dist-apks
          mkdir -p dist-apks
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias maxplay -keyalg RSA -keysize 2048 -validity 10000 -storepass maxplay123 -keypass maxplay123 -dname "CN=MaxPlay, OU=App, O=MaxPlay, L=Mumbai, S=MH, C=IN"
          fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk dist-apks/MaxPlay.apk
          gradle assembleRelease -PadminApp=true --no-daemon
          cp app/build/outputs/apk/release/app-release.apk dist-apks/MaxPlay-Admin.apk
          ls -lh dist-apks/

      - name: Upload Ready-to-Install MaxPlay APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlay-Android-Kotlin-APK
          path: android-kotlin/dist-apks/MaxPlay.apk
          if-no-files-found: error

      - name: Upload Ready-to-Install MaxPlay Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlay-Admin-Kotlin-APK
          path: android-kotlin/dist-apks/MaxPlay-Admin.apk
          if-no-files-found: error
